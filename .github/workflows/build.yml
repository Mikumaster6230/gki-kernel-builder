name: Build GKI 5.4 Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: false
        default: "5.4"
      device_name:
        description: "Device name"
        required: false
        default: "meizu18s"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "KERNEL_VERSION=${{ github.event.inputs.kernel_version || '5.4' }}" >> $GITHUB_ENV
          echo "DEVICE=${{ github.event.inputs.device_name || 'meizu18s' }}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential flex bison bc git make rsync \
            libssl-dev device-tree-compiler cpio \
            python3 python3-pip wget curl ca-certificates \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu

      - name: Setup toolchain symlinks
        run: |
          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/lld-14 /usr/local/bin/lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/local/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-14 /usr/local/bin/llvm-readelf

      - name: Cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: ~/kernel
          key: gki-5.4-source-v12

      - name: Clone GKI 5.10 kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --single-branch \
            -b android13-5.10 \
            https://github.com/aosp-mirror/kernel_common.git \
            ~/kernel || \
          git clone --depth=1 --single-branch \
            -b deprecated/android13-5.10 \
            https://github.com/aosp-mirror/kernel_common.git \
            ~/kernel

      - name: Download and integrate KernelSU
        run: |
          cd ~/kernel
          # KernelSU v0.9.5 — manual integration (kprobe doesn't work on this device)
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          echo "KernelSU v0.9.5 downloaded"

      - name: Apply KSU manual kernel patches
        run: |
          cd ~/kernel
          # === Patch 1: fs/exec.c - do_execveat_common ===
          KSU_EXEC_HOOK='
          #ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          #endif
          '
          sed -i "/^static int do_execveat_common/i${KSU_EXEC_HOOK}" fs/exec.c
          sed -i '/^static int do_execveat_common/,/^{/!b; /^{/a\
          #ifdef CONFIG_KSU\
          \tif (unlikely(ksu_execveat_hook))\
          \t\tksu_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\
          \telse\
          \t\tksu_handle_execveat_sucompat(\&fd, \&filename, \&argv, \&envp, \&flags);\
          #endif' fs/exec.c
          echo "Patch 1/4: fs/exec.c done"

          # === Patch 2: fs/open.c - faccessat ===
          KSU_OPEN_HOOK='
          #ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
          #endif
          '
          sed -i "/^SYSCALL_DEFINE3(faccessat/i${KSU_OPEN_HOOK}" fs/open.c
          # Find the first "if (mode" line after faccessat and insert before it
          sed -i '/SYSCALL_DEFINE3(faccessat/,/if (mode/{/if (mode/i\
          \t#ifdef CONFIG_KSU\
          \t\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\
          \t#endif
          }' fs/open.c
          echo "Patch 2/4: fs/open.c done"

          # === Patch 3: fs/read_write.c - vfs_read ===
          KSU_READ_HOOK='
          #ifdef CONFIG_KSU
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);
          #endif
          '
          sed -i "/^ssize_t vfs_read(/i${KSU_READ_HOOK}" fs/read_write.c
          sed -i '/^ssize_t vfs_read(/,/^{/!b; /^{/a\
          #ifdef CONFIG_KSU\
          \tksu_handle_vfs_read(\&file, \&buf, \&count, \&pos);\
          #endif' fs/read_write.c
          echo "Patch 3/4: fs/read_write.c done"

          # === Patch 4: fs/stat.c - vfs_fstatat ===
          KSU_STAT_HOOK='
          #ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          #endif
          '
          sed -i "/^int vfs_fstatat(/i${KSU_STAT_HOOK}" fs/stat.c
          sed -i '/^int vfs_fstatat(/,/^{/!b; /^{/a\
          \t#ifdef CONFIG_KSU\
          \t\tksu_handle_stat(\&dfd, \&filename, \&flag);\
          \t#endif' fs/stat.c
          echo "Patch 4/4: fs/stat.c done"

          echo "All KSU manual patches applied"

      - name: Configure kernel
        run: |
          cd ~/kernel
          make O=out ARCH=arm64 mrproper 2>/dev/null || true
          # Use STOCK kernel config from device boot.img
          cp $GITHUB_WORKSPACE/stock_defconfig out/.config
          # Disable kprobe (manual integration doesn't need it, avoids safe mode issues)
          scripts/config --file out/.config --disable KPROBES
          scripts/config --file out/.config --disable KPROBE_EVENTS
          scripts/config --file out/.config --disable HAVE_KPROBES
          # Enable KernelSU
          scripts/config --file out/.config --enable KSU
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          cd ~/kernel
          # Sync config with clang environment (resolves LTO_CLANG, SHADOW_CALL_STACK, RELR etc.)
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # Build
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Check build result
        run: |
          cd ~/kernel
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "SUCCESS: Image found!"
            ls -lh out/arch/arm64/boot/Image*
          else
            echo "FAIL: Image not found"
            tail -80 build.log
            exit 1
          fi

      - name: Package artifacts
        run: |
          mkdir -p ~/artifacts/modules
          cd ~/kernel
          cp out/arch/arm64/boot/Image ~/artifacts/Image 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz ~/artifacts/Image.gz 2>/dev/null || true
          find out/ -name "*.ko" -exec cp {} ~/artifacts/modules/ \; 2>/dev/null || true
          cp out/.config ~/artifacts/kernel_config 2>/dev/null || true
          cd ~/artifacts
          tar -czf GKI-${KERNEL_VERSION}-${DEVICE}-${BUILD_TIME}.tar.gz *
          ls -lh ~/artifacts/

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ env.KERNEL_VERSION }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: ~/artifacts/GKI-*.tar.gz
          retention-days: 30

      - name: Build summary
        run: |
          echo "============================================"
          echo "  GKI ${{ env.KERNEL_VERSION }} Kernel Built"
          echo "============================================"