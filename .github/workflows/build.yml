name: Build GKI 5.4 Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: false
        default: "5.4"
      device_name:
        description: "Device name"
        required: false
        default: "meizu18s"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "KERNEL_VERSION=${{ github.event.inputs.kernel_version || '5.4' }}" >> $GITHUB_ENV
          echo "DEVICE=${{ github.event.inputs.device_name || 'meizu18s' }}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential flex bison bc git make rsync \
            libssl-dev device-tree-compiler cpio \
            python3 python3-pip wget curl ca-certificates \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu

      - name: Setup toolchain symlinks
        run: |
          sudo ln -sf /usr/bin/clang-14 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/lld-14 /usr/local/bin/lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/local/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-14 /usr/local/bin/llvm-readelf

      - name: Cache kernel source
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: ~/kernel
          key: gki-5.4-source-v12

      - name: Clone GKI 5.4 kernel source
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --single-branch \
            -b android12-5.4 \
            https://github.com/aosp-mirror/kernel_common.git \
            ~/kernel || \
          git clone --depth=1 --single-branch \
            -b deprecated/android12-5.4 \
            https://github.com/aosp-mirror/kernel_common.git \
            ~/kernel

      - name: Download and integrate KernelSU
        run: |
          cd ~/kernel
          # Use latest KernelSU with minimal 5.4 compat patches
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          # === 5.4 compat: pgtable.h + strncpy_from_user_nofault ===
          cat > include/linux/pgtable.h << 'EOF'
          #ifndef _LINUX_PGTABLE_H
          #define _LINUX_PGTABLE_H
          #include <asm/pgtable.h>
          #ifndef pte_index
          static inline unsigned long pte_index(unsigned long a){return (a>>PAGE_SHIFT)&(PTRS_PER_PTE-1);}
          #endif
          #ifndef pmd_index
          static inline unsigned long pmd_index(unsigned long a){return (a>>PMD_SHIFT)&(PTRS_PER_PMD-1);}
          #endif
          #endif
          EOF
          cat > include/linux/ksu54.h << 'EOF'
          #ifndef _KSU54_H
          #define _KSU54_H
          #include <linux/uaccess.h>
          #include <linux/sched.h>
          #include <linux/sched/task.h>
          #ifndef TWA_RESUME
          #define TWA_RESUME 1
          #endif
          static inline long strncpy_from_user_nofault(char *d, const void __user *u, long n){
            long r; pagefault_disable(); r=strncpy_from_user(d,(const char __user*)u,n); pagefault_enable(); return r;
          }
          #endif
          EOF
          # Inject compat header into all KSU C files
          for f in $(find drivers/kernelsu -name '*.c'); do
            grep -q ksu54.h "$f" 2>/dev/null || sed -i '1i#include "ksu54.h"' "$f"
          done
          # Disable KSU SELinux module (incompatible with 5.4 internal APIs)
          sed -i 's/obj-\$(CONFIG_KSU)/# disabled-for-5.4 # &/' drivers/kernelsu/selinux/Makefile 2>/dev/null || true
          echo "KernelSU integrated with 5.4 compat"

      - name: Configure kernel
        run: |
          cd ~/kernel
          make O=out ARCH=arm64 mrproper 2>/dev/null || true
          make O=out ARCH=arm64 gki_defconfig
          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable HAVE_KPROBES
          scripts/config --file out/.config --enable KPROBE_EVENTS
          scripts/config --file out/.config --enable OVERLAY_FS
          scripts/config --file out/.config --enable MODULES
          scripts/config --file out/.config --enable MODULE_UNLOAD
          scripts/config --file out/.config --disable DEBUG_INFO
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          cd ~/kernel
          # Sync config with clang environment (resolves LTO_CLANG, SHADOW_CALL_STACK, RELR etc.)
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          # Build
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Check build result
        run: |
          cd ~/kernel
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "SUCCESS: Image found!"
            ls -lh out/arch/arm64/boot/Image*
          else
            echo "FAIL: Image not found"
            tail -80 build.log
            exit 1
          fi

      - name: Package artifacts
        run: |
          mkdir -p ~/artifacts/modules
          cd ~/kernel
          cp out/arch/arm64/boot/Image ~/artifacts/Image 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz ~/artifacts/Image.gz 2>/dev/null || true
          find out/ -name "*.ko" -exec cp {} ~/artifacts/modules/ \; 2>/dev/null || true
          cp out/.config ~/artifacts/kernel_config 2>/dev/null || true
          cd ~/artifacts
          tar -czf GKI-${KERNEL_VERSION}-${DEVICE}-${BUILD_TIME}.tar.gz *
          ls -lh ~/artifacts/

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ env.KERNEL_VERSION }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: ~/artifacts/GKI-*.tar.gz
          retention-days: 30

      - name: Build summary
        run: |
          echo "============================================"
          echo "  GKI ${{ env.KERNEL_VERSION }} Kernel Built"
          echo "============================================"